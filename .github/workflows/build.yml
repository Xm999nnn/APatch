name: Build Manager

on:
  push:
    tags: [ "*" ]
    branches: [ "main" ]
    paths:
      - '.github/workflows/build.yml'
      - 'app/**'
      - 'apd/**'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'version.properties'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/build.yml'
      - 'app/**'
      - 'apd/**'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'version.properties'
  workflow_call:
  workflow_dispatch:

jobs:
  build-manager:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch kpimg manager signature
        env:
          # Manager APK signing-cert SHA-256 (base64). Override with a repo
          # variable MANAGER_SIG_SHA256 if needed; default is the fork's key.
          MANAGER_SIG_SHA256: ${{ vars.MANAGER_SIG_SHA256 || 'REH3eiyyMUGbrtupH8F10GNbTUhcjXkvMTgaPLxgB+Y=' }}
        run: |
          KP_VERSION=$(grep -E '^#define (MAJOR|MINOR|PATCH)' app/src/main/cpp/version | awk '{printf "%s%s", (n++?".":""), $3}')
          echo "KernelPatch version: $KP_VERSION"
          mkdir -p app/src/main/assets
          curl -fsSL -o app/src/main/assets/kpimg \
            "https://github.com/bmax121/KernelPatch/releases/download/${KP_VERSION}/kpimg-android"
          python3 - <<'EOF'
          import base64, os, sys

          path = "app/src/main/assets/kpimg"
          data = open(path, "rb").read()

          # Upstream trusted-manager digests baked into KernelPatch's
          # kernel/patch/android/userd.c trusted_managers[] table.
          upstream = [
              bytes.fromhex("d71dadc0ca07bdf594383bfb2a445134a07339f12a27044a1b326981acf5f319"),  # me.bmax.apatch
              bytes.fromhex("e51133125fef56aa528391fcc20494ebb538bd8e093d6c475d6d002a7a121a8f"),  # com.example.apatch
          ]
          mine = base64.b64decode(os.environ["MANAGER_SIG_SHA256"])
          assert len(mine) == 32, f"digest must be 32 bytes, got {len(mine)}"

          for old in upstream:
              n = data.count(old)
              if n == 0:
                  print(f"warning: upstream digest {old.hex()} not found, skipping")
                  continue
              data = data.replace(old, mine)
              print(f"replaced digest {old.hex()} x{n}")

          open(path, "wb").write(data)
          print("kpimg manager signature patched OK")
          EOF
          # The patched file is newer than the remote release, so the gradle
          # downloadKpimg task sees it as up-to-date and won't overwrite it.

      - name: Generate version
        id: parse_version
        run: |
          COMMIT_NUM=$(git rev-list --count HEAD)
          source version.properties
          VERSION=$((managerVersionEpoch + COMMIT_NUM))
          echo "Generated Version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install toolchain
        run: |
          rustup default stable
          rustup update stable
          cargo install cargo-ndk
          rustup target install aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apd
          cache-targets: false

      - name: Build with Gradle
        run: |
          echo 'org.gradle.parallel=true' >> gradle.properties
          echo 'org.gradle.vfs.watch=true' >> gradle.properties
          echo 'org.gradle.jvmargs=-Xmx2048m' >> gradle.properties
          echo 'android.native.buildOutput=verbose' >> gradle.properties
          sed -i 's/org.gradle.configuration-cache=true//g' gradle.properties
          ./gradlew clean assembleDebug assembleRelease
          echo "BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)" >> $GITHUB_ENV

      - name: Sign Release (v2 only)
        id: sign_app
        if: ${{ env.SIGNING_KEY != '' }}
        continue-on-error: true
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/apatch-signing.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/apatch-signing.jks"
          SIGNED=$(bash .github/scripts/sign_v2_only.sh app/build/outputs/apk/release | tail -n 1)
          echo "signedReleaseFile=$SIGNED" >> "$GITHUB_OUTPUT"
          echo "signedReleaseFile0=$SIGNED" >> "$GITHUB_OUTPUT"
          echo "signedReleaseFiles=$SIGNED" >> "$GITHUB_OUTPUT"
          echo "nofSignedReleaseFiles=1" >> "$GITHUB_OUTPUT"

      - name: Sign Debug APK (v2 only)
        id: sign_debug_app
        if: ${{ env.SIGNING_KEY != '' }}
        continue-on-error: true
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/apatch-signing.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/apatch-signing.jks"
          SIGNED=$(bash .github/scripts/sign_v2_only.sh app/build/outputs/apk/debug | tail -n 1)
          echo "signedReleaseFile=$SIGNED" >> "$GITHUB_OUTPUT"
          echo "signedReleaseFile0=$SIGNED" >> "$GITHUB_OUTPUT"
          echo "signedReleaseFiles=$SIGNED" >> "$GITHUB_OUTPUT"
          echo "nofSignedReleaseFiles=1" >> "$GITHUB_OUTPUT"

      - name: Upload mappings
        uses: actions/upload-artifact@v7
        with:
          name: "mappings"
          path: "app/build/outputs/mapping/release/"

      - name: Upload build artifact1
        uses: actions/upload-artifact@v7
        with:
          name: APatch-Release
          # With SIGNING_KEY configured, sign_v2_only.sh drops a *-signed.apk
          # next to the build output; prefer it. Without it, upload the APK
          # signed with the fallback debug key produced by apksign.
          path: |
            app/build/outputs/apk/release/*-signed.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload build artifact2
        uses: actions/upload-artifact@v7
        with:
          name: APatch-Debug
          path: |
            app/build/outputs/apk/debug/*-signed.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Release apk
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        if: ${{ env.SIGNING_KEY != '' && github.ref_type == 'tag' }}
        continue-on-error: true
        uses: ncipollo/release-action@v1
        with:
          token: ${{ github.token }}
          tag: ${{ steps.parse_version.outputs.VERSION }}
          artifacts: ${{steps.sign_app.outputs.signedReleaseFile}}
          generateReleaseNotes: true
          makeLatest: true
          replacesArtifacts: true
